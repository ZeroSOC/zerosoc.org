<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="gt-title gt-desc">
  <title id="gt-title">Proposed gates of a Case and the metrics they anchor</title>
  <desc id="gt-desc">Timeline from T0, the first malicious event, through G1 Alerts received, G2 Triage disposition, G3 Incident declared, G4 First containment, G5 Eradication verified, G6 Recovery complete and G7 Case closed. The phases between them are detection, triage, investigation, containment, eradication, recovery and lessons learned. MTTD runs from T0 to G1. MTTI runs from G1 to G3, or to G2 when triage closes the Case as False Positive, Benign Positive or Duplicate. MTTC runs from G1 to G4; whether it should start at T0 instead is open. MTTR starts at G1 and stops at G4, G5 or G6; which one is open.</desc>
  <style>
    .seg { font: 600 14px 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; fill: #475569; font-style: italic; }
    .g { font: 700 12px 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
    .gl { font: 500 12.5px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #0f172a; }
    .bar { font: 700 12px 'Fira Code', ui-monospace, Menlo, Consolas, monospace; fill: #ffffff; }
    .alt { font: 600 12.5px 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .tick { stroke: #94a3b8; stroke-opacity: 0.45; stroke-width: 1; stroke-dasharray: 3 4; }
  </style>
  <defs>
    <marker id="gt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Guides from each gate down through the metric rows -->
  <g class="tick">
    <line x1="60" y1="120" x2="60" y2="290"/><line x1="182" y1="120" x2="182" y2="290"/>
    <line x1="304" y1="120" x2="304" y2="290"/><line x1="426" y1="120" x2="426" y2="290"/>
    <line x1="548" y1="120" x2="548" y2="290"/><line x1="670" y1="120" x2="670" y2="290"/>
    <line x1="792" y1="120" x2="792" y2="290"/><line x1="914" y1="120" x2="914" y2="290"/>
  </g>

  <!-- Phases between gates -->
  <g class="seg" text-anchor="middle">
    <text x="121" y="34">Detection</text><text x="243" y="34">Triage</text>
    <text x="365" y="34">Investigation</text><text x="487" y="34">Containment</text>
    <text x="609" y="34">Eradication</text><text x="731" y="34">Recovery</text>
    <text x="853" y="34">Lessons learned</text>
  </g>

  <!-- Axis and gates -->
  <line x1="30" y1="56" x2="946" y2="56" stroke="#94a3b8" stroke-width="2" marker-end="url(#gt-arrow)"/>
  <g class="g" text-anchor="middle">
    <circle cx="60" cy="56" r="16" fill="#0f172a"/><text x="60" y="60" fill="#ffffff">T0</text>
    <circle cx="182" cy="56" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="182" y="60" fill="#1d4ed8">G1</text>
    <circle cx="304" cy="56" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="304" y="60" fill="#1d4ed8">G2</text>
    <circle cx="426" cy="56" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="426" y="60" fill="#1d4ed8">G3</text>
    <circle cx="548" cy="56" r="16" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><text x="548" y="60" fill="#c2410c">G4</text>
    <circle cx="670" cy="56" r="16" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><text x="670" y="60" fill="#c2410c">G5</text>
    <circle cx="792" cy="56" r="16" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><text x="792" y="60" fill="#c2410c">G6</text>
    <circle cx="914" cy="56" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="914" y="60" fill="#1d4ed8">G7</text>
  </g>
  <g class="gl" text-anchor="middle">
    <text x="60" y="94">First malicious</text><text x="60" y="110">event</text>
    <text x="182" y="94">Alert(s)</text><text x="182" y="110">received</text>
    <text x="304" y="94">Triage</text><text x="304" y="110">disposition</text>
    <text x="426" y="94">Incident</text><text x="426" y="110">declared</text>
    <text x="548" y="94">First</text><text x="548" y="110">containment</text>
    <text x="670" y="94">Eradication</text><text x="670" y="110">verified</text>
    <text x="792" y="94">Recovery</text><text x="792" y="110">complete</text>
    <text x="914" y="94">Case</text><text x="914" y="110">closed</text>
  </g>

  <!-- MTTD: T0 to G1 -->
  <rect x="62" y="136" width="118" height="28" rx="6" fill="#1e3a8a"/>
  <text x="72" y="155" class="bar">MTTD</text>

  <!-- MTTI: G1 to G3, or to G2 when triage closes the Case -->
  <rect x="184" y="174" width="240" height="28" rx="6" fill="#2563eb"/>
  <line x1="304" y1="177" x2="304" y2="199" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="194" y="193" class="bar">MTTI</text>
  <text x="436" y="193" class="alt" fill="#1d4ed8">or to G2, if triage closes the Case (FP, BP, Duplicate)</text>

  <!-- MTTC: G1 to G4, or from T0? -->
  <rect x="63" y="213" width="116" height="26" rx="6" fill="#f3eefe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="73" y="231" class="alt" fill="#6d28d9">or from T0?</text>
  <rect x="184" y="212" width="362" height="28" rx="6" fill="#7c3aed"/>
  <text x="194" y="231" class="bar">MTTC</text>

  <!-- MTTR: G1 to G4, or to G5, or to G6? -->
  <rect x="184" y="250" width="362" height="28" rx="6" fill="#ea580c"/>
  <text x="194" y="269" class="bar">MTTR</text>
  <rect x="551" y="251" width="238" height="26" rx="6" fill="#fdf1ea" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="561" y="269" class="alt" fill="#c2410c">or to G5, or to G6?</text>
</svg>
